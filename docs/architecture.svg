<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">obsidian-kglite: the vault and graph loop in both directions</title>
  <desc id="desc">An Obsidian vault is read by kglite okf check and build into a .kgl property graph. The graph answers Cypher queries, produces a health report and serves agents over MCP; it also writes back to the vault as a canvas, a skipped backlinks index, or a sealed export.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="backarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .accent { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; rx: 10; }
      .h { font: 600 16px/1.3 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .s { font: 400 12.5px/1.4 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .m { font: 500 13px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; fill: #1d4ed8; }
      .e { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .b { stroke: #1d4ed8; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#backarrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="380" fill="#ffffff"/>
  <text x="32" y="38" class="h">obsidian-kglite: the loop runs both ways</text>
  <text x="32" y="60" class="s">Reading is read-only. Writing back has three mechanisms, and only one of them changes the graph.</text>

  <rect class="box" x="32" y="110" width="216" height="96"/>
  <text x="52" y="142" class="h">Obsidian vault</text>
  <text x="52" y="166" class="s">Markdown, frontmatter,</text>
  <text x="52" y="184" class="s">wikilinks, tags, .kglite/</text>

  <rect class="box" x="304" y="110" width="216" height="96"/>
  <text x="324" y="142" class="h">kglite okf check / build</text>
  <text x="324" y="166" class="s">one read, reported twice:</text>
  <text x="324" y="184" class="m">check VAULT --strict</text>

  <rect class="accent" x="576" y="110" width="176" height="96"/>
  <text x="596" y="142" class="h">.kgl graph</text>
  <text x="596" y="166" class="s">notes, sections,</text>
  <text x="596" y="184" class="s">chunks, tags, edges</text>

  <rect class="box" x="808" y="82" width="120" height="56"/>
  <text x="826" y="115" class="m">Cypher</text>
  <rect class="box" x="808" y="150" width="120" height="56"/>
  <text x="826" y="183" class="m">report</text>
  <rect class="box" x="808" y="218" width="120" height="56"/>
  <text x="826" y="251" class="m">MCP</text>

  <path class="e" d="M 248 158 H 300"/>
  <path class="e" d="M 520 158 H 572"/>
  <path class="e" d="M 752 142 C 776 142 780 110 804 110"/>
  <path class="e" d="M 752 158 H 804"/>
  <path class="e" d="M 752 176 C 776 176 780 246 804 246"/>

  <path class="b" d="M 664 206 C 664 300 520 300 300 300 C 180 300 140 280 140 210"/>
  <text x="330" y="326" class="m">write back: canvas · skipped index · sealed export</text>
  <text x="330" y="344" class="s">canvas and the kg_skip index leave every count unchanged; a sealed export is a new tree</text>

  <text x="32" y="366" class="s">Bidirectional links: one directed edge in the graph, two views in the vault — outbound in the note, inbound in the backlink panel.</text>
</svg>
